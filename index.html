<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的旅行打卡地图</title>
  <style>
    :root {
      --primary-color: #3a86ff;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2b2d42;
      --border-color: #e9ecef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }

    /* 顶部固定进度条 */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
    .progress-bar-bg { background: #e9ecef; height: 10px; border-radius: 5px; overflow: hidden; }
    .progress-bar-fill { background: var(--primary-color); height: 100%; width: 0%; transition: width 0.3s ease; }

    /* 主容器 */
    .main-container { display: flex; flex: 1; flex-direction: column; }

    /* 手机端分类导航（横向滑动、无空白） */
    sidebar {
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    
    .continent-group { display: inline-block; margin-right: 8px; }
    .continent-title {
      display: inline-block;
      padding: 6px 12px;
      background: #f0f4f8;
      border-radius: 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .continent-title.active { background: var(--primary-color); color: #fff; }

    .country-list {
      display: none;
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      white-space: nowrap;
    }
    .country-list.show { display: block; }

    .country-item {
      display: inline-block;
      padding: 4px 10px;
      margin-right: 6px;
      border-radius: 12px;
      font-size: 0.82rem;
      background: #f8f9fa;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }
    .country-item.active { border-color: var(--primary-color); color: var(--primary-color); font-weight: 600; }

    /* 卡片列表区 */
    .content-area { flex: 1; padding: 12px; }
    
    /* 手机端：单列显示，一行一个卡片 */
    .cards-list { display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }

    /* 卡片设计 - 手机横向排布 */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 10px;
      gap: 12px;
    }

    .card img {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .card-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 0.8rem;
      color: #6c757d;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    /* 复选框样式 */
    .check-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      align-self: flex-start;
    }

    .check-container input {
      width: 20px;
      height: 20px;
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    /* 桌面端自动适配侧边栏 */
    @media (min-width: 768px) {
      .main-container { flex-direction: row; }
      sidebar { width: 220px; border-right: 1px solid var(--border-color); border-bottom: none; white-space: normal; padding: 15px; }
      .continent-group { display: block; margin-right: 0; margin-bottom: 10px; }
      .continent-title { display: block; border-radius: 6px; }
      .country-list { display: block !important; padding: 5px 0 5px 15px; border-bottom: none; white-space: normal; }
      .country-item { display: block; margin: 4px 0; border: none; background: none; }
      .content-area { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- 顶部进度条 -->
  <header>
    <div class="progress-info">
      <span>旅行打卡进度</span>
      <span id="progress-text">加载中...</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </header>

  <div class="main-container">
    <!-- 分类导航（有数据才显示） -->
    <sidebar id="sidebar"></sidebar>

    <!-- 打卡卡片列表（一行一个） -->
    <main class="content-area">
      <div class="cards-list" id="cards-list"></div>
    </main>
  </div>

  <script>
    // 已为你填入验证通过的 Google Apps Script 链接
    const API_URL = "https://script.google.com/macros/s/AKfycbz2_OICejP3i7k9sOw9bVj7hCATxl9kk7Xf-_hJmBInI_xkmpTvoI4cc0eWJSkOf2fw/exec";

    let travelData = [];
    let currentFilter = { type: 'all', value: '' };

    // 获取数据（只计算实际填写的有效行）
    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        const rawData = await response.json();
        
        // 过滤表格中的空行，有名称才算一条数据
        travelData = rawData.filter(item => item.Name && String(item.Name).trim() !== "");
        
        renderSidebar();
        renderCards();
        updateProgress();
      } catch (err) {
        console.error("加载数据失败:", err);
        alert("数据加载失败，请检查网络或配置。");
      }
    }

    // 更新实际进度（填几个显示几个）
    function updateProgress() {
      const total = travelData.length;
      const visited = travelData.filter(item => item.IsVisited === true || String(item.IsVisited).toUpperCase() === "TRUE").length;
      const percentage = total > 0 ? Math.round((visited / total) * 100) : 0;

      document.getElementById('progress-text').innerText = `${visited} / ${total} (${percentage}%)`;
      document.getElementById('progress-fill').style.width = `${percentage}%`;
    }

    // 按需渲染分类
    function renderSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '';

      // “全部”按钮
      const allBtn = document.createElement('div');
      allBtn.className = `continent-title ${currentFilter.type === 'all' ? 'active' : ''}`;
      allBtn.innerText = '全部';
      allBtn.onclick = () => {
        currentFilter = { type: 'all', value: '' };
        renderSidebar();
        renderCards();
      };
      
      const allGroup = document.createElement('div');
      allGroup.className = 'continent-group';
      allGroup.appendChild(allBtn);
      sidebar.appendChild(allGroup);

      // 只提取表格里实际拥有景点的大洲
      const activeContinents = [...new Set(travelData.map(item => item.Continent))].filter(Boolean);

      activeContinents.forEach(continent => {
        const contGroup = document.createElement('div');
        contGroup.className = 'continent-group';

        const titleEl = document.createElement('div');
        const isActive = currentFilter.type === 'continent' && currentFilter.value === continent;
        titleEl.className = `continent-title ${isActive ? 'active' : ''}`;
        titleEl.innerText = continent;

        titleEl.onclick = () => {
          currentFilter = { type: 'continent', value: continent };
          renderSidebar();
          renderCards();
        };

        contGroup.appendChild(titleEl);
        sidebar.appendChild(contGroup);
      });
    }

    // 渲染景点卡片（一行一个）
    function renderCards() {
      const container = document.getElementById('cards-list');
      container.innerHTML = '';

      let filteredData = travelData;
      if (currentFilter.type === 'continent') {
        filteredData = travelData.filter(item => item.Continent === currentFilter.value);
      }

      if (filteredData.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#888; padding:30px;">暂无景点数据</div>';
        return;
      }

      filteredData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const isChecked = item.IsVisited === true || String(item.IsVisited).toUpperCase() === "TRUE";

        card.innerHTML = `
          <img src="${item.ImageURL || 'https://via.placeholder.com/150?text=No+Image'}" alt="${item.Name}">
          <div class="card-body">
            <div>
              <div class="card-title">${item.Name}</div>
              <div class="card-desc">${item.Description || '暂无描述'}</div>
            </div>
            <label class="check-container">
              <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleVisit(${item.ID}, this.checked)">
              <span>${isChecked ? '已打卡' : '未打卡'}</span>
            </label>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 打卡同步到后台
    async function toggleVisit(id, isChecked) {
      const item = travelData.find(i => i.ID == id);
      if (item) item.IsVisited = isChecked;
      
      updateProgress();

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id, isVisited: isChecked })
        });
      } catch (err) {
        console.error("同步至 Google Sheet 失败:", err);
      }
    }

    // 启动
    fetchData();
  </script>
</body>
</html>
