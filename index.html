<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✈️乔治与橄榄的世界旅行💗</title>
  <style>
    :root {
      --primary: #3a86ff;
      --bg: #f5f6f9;
      --card-bg: #ffffff;
      --text: #2b2d42;
      --border: #e9ecef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* 顶部固定进度条 */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .progress-info { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    .progress-bar-bg { background: #e9ecef; height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s ease; }

    /* 顶部分类横向滑动菜单 */
    .nav-container {
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 55px;
      z-index: 99;
    }

    .continents-bar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .continents-bar::-webkit-scrollbar { display: none; }

    .nav-tag {
      display: inline-block;
      padding: 6px 14px;
      background: #f0f4f8;
      color: #555;
      border-radius: 18px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .nav-tag.active { background: var(--primary); color: #fff; }

    .countries-bar {
      display: none;
      gap: 6px;
      padding: 8px 12px;
      background: #fafbfc;
      border-top: 1px dashed var(--border);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .countries-bar::-webkit-scrollbar { display: none; }
    .countries-bar.show { display: flex; }

    .country-tag {
      padding: 4px 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.78rem;
      color: #666;
      cursor: pointer;
      flex-shrink: 0;
    }
    .country-tag.active { border-color: var(--primary); color: var(--primary); font-weight: bold; }

    /* 列表主内容区 */
    .content-area {
      flex: 1;
      padding: 12px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 卡片设计 - 右侧无文字复选框 */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      padding: 10px 14px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .card img {
      width: 75px;
      height: 75px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: bold;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 0.8rem;
      color: #6c757d;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 纯图标打卡复选框（居右） */
    .check-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 6px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .check-container input {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 顶部打卡进度 -->
  <header>
    <div class="progress-info">
      <span>全球足迹打卡进度</span>
      <span id="progress-text">加载中...</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </header>

  <!-- 顶部分类导航 -->
  <div class="nav-container">
    <div class="continents-bar" id="continents-bar"></div>
    <div class="countries-bar" id="countries-bar"></div>
  </div>

  <!-- 卡片列表区域 -->
  <main class="content-area">
    <div class="cards-list" id="cards-list"></div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz2_OICejP3i7k9sOw9bVj7hCATxl9kk7Xf-_hJmBInI_xkmpTvoI4cc0eWJSkOf2fw/exec";

    let travelData = [];
    let currentContinent = 'ALL';
    let currentCountry = 'ALL';

    // 初始化数据
    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        const rawData = await response.json();
        
        // 过滤空行，只留有景点的行
        travelData = rawData.filter(item => item.Name && String(item.Name).trim() !== "");
        
        renderNav();
        renderCards();
        updateProgress();
      } catch (err) {
        console.error("加载失败:", err);
      }
    }

    // 更新实际打卡进度
    function updateProgress() {
      const total = travelData.length;
      const visited = travelData.filter(item => item.IsVisited === true || String(item.IsVisited).toUpperCase() === "TRUE").length;
      const percentage = total > 0 ? Math.round((visited / total) * 100) : 0;

      document.getElementById('progress-text').innerText = `${visited} / ${total} (${percentage}%)`;
      document.getElementById('progress-fill').style.width = `${percentage}%`;
    }

    // 渲染导航标签
    function renderNav() {
      const contBar = document.getElementById('continents-bar');
      contBar.innerHTML = '';

      // 全部按钮
      const allTag = document.createElement('div');
      allTag.className = `nav-tag ${currentContinent === 'ALL' ? 'active' : ''}`;
      allTag.innerText = '全部';
      allTag.onclick = () => {
        currentContinent = 'ALL';
        currentCountry = 'ALL';
        renderNav();
        renderCards();
      };
      contBar.appendChild(allTag);

      // 按需获取大洲列表
      const continents = [...new Set(travelData.map(item => item.Continent))].filter(Boolean);

      continents.forEach(cont => {
        const tag = document.createElement('div');
        tag.className = `nav-tag ${currentContinent === cont ? 'active' : ''}`;
        tag.innerText = cont;
        tag.onclick = () => {
          currentContinent = cont;
          currentCountry = 'ALL';
          renderNav();
          renderCards();
        };
        contBar.appendChild(tag);
      });

      // 渲染二级国家栏
      const countryBar = document.getElementById('countries-bar');
      countryBar.innerHTML = '';

      if (currentContinent !== 'ALL') {
        const countries = [...new Set(travelData.filter(i => i.Continent === currentContinent).map(i => i.Country))].filter(Boolean);
        
        if (countries.length > 0) {
          countryBar.classList.add('show');
          
          const allCountryTag = document.createElement('div');
          allCountryTag.className = `country-tag ${currentCountry === 'ALL' ? 'active' : ''}`;
          allCountryTag.innerText = '全部国家';
          allCountryTag.onclick = () => {
            currentCountry = 'ALL';
            renderNav();
            renderCards();
          };
          countryBar.appendChild(allCountryTag);

          countries.forEach(country => {
            const cTag = document.createElement('div');
            cTag.className = `country-tag ${currentCountry === country ? 'active' : ''}`;
            cTag.innerText = country;
            cTag.onclick = () => {
              currentCountry = country;
              renderNav();
              renderCards();
            };
            countryBar.appendChild(cTag);
          });
        } else {
          countryBar.classList.remove('show');
        }
      } else {
        countryBar.classList.remove('show');
      }
    }

    // 渲染景点列表
    function renderCards() {
      const container = document.getElementById('cards-list');
      container.innerHTML = '';

      let list = travelData;
      if (currentContinent !== 'ALL') {
        list = list.filter(i => i.Continent === currentContinent);
      }
      if (currentCountry !== 'ALL') {
        list = list.filter(i => i.Country === currentCountry);
      }

      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#999; padding:40px 0;">暂无相关景点数据</div>';
        return;
      }

      list.forEach(item => {
        const isChecked = item.IsVisited === true || String(item.IsVisited).toUpperCase() === "TRUE";
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <img src="${item.ImageURL || 'https://via.placeholder.com/150?text=No+Photo'}" alt="${item.Name}">
          <div class="card-body">
            <div class="card-title">${item.Name}</div>
            <div class="card-desc">${item.Description || '计划中'}</div>
          </div>
          <label class="check-container">
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleVisit(${item.ID}, this.checked)">
          </label>
        `;
        container.appendChild(card);
      });
    }

    // 打卡同步回传
    async function toggleVisit(id, isChecked) {
      const item = travelData.find(i => i.ID == id);
      if (item) item.IsVisited = isChecked;
      
      updateProgress();

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id, isVisited: isChecked })
        });
      } catch (err) {
        console.error("同步失败:", err);
      }
    }

    fetchData();
  </script>
</body>
</html>
